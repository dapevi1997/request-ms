server:
  port: ${APP_PORT}
spring:
  application:
    name: "RequestMS"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
routes:
  paths:
    crearSolicitud: "/api/v1/solicitud"
    solicitudesRevision: "/api/v1/solicitud"
    actualizarSolicitud: "/api/v1/solicitud"
springdoc:
  swagger-ui:
    path: "/swagger-docs"
  api-docs:
    path: "/api-docs"
    groups:
      enabled: true
adapters:
  r2dbc:
    host: ${R2DBC_HOST}
    port: ${R2DBC_PORT}
    database: "solicitudes"
    schema: "V1__init-config-database-dev.sql"
    username: ${R2DBC_USERNAME}
    password: ${R2DBC_PASSWORD}
flyway:
  enabled: true
  baseline-on-migrate: true
  locations: "classpath:db/migration"
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
adapter:
  restconsumer:
    timeout: ${REST_CONSUMER_TIMEOUT}
    url: http://${REST_CONSUMER_HOST}:${REST_CONSUMER_PORT}
  sqs:
    region: ${SQS_REGION}
    queueUrl: ${SQS_QUEUE_URL}
    #endpoint: "http://localhost:4566"
    accessKeyId: ${AWS_ACCESS_KEY_ID}
    secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"