server:
  port: 8080
spring:
  application:
    name: "RequestMS"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
springdoc:
  swagger-ui:
    path: "/swagger-docs"
  api-docs:
    path: "/api-docs"
    groups:
      enabled: true
adapters:
  r2dbc:
    host: "localhost"
    port: 3306
    database: "solicitudes"
    schema: "init-config-database-dev.sql"
    username: "user"
    password: "password"
flyway:
  enabled: true
  baseline-on-migrate: true
  locations: "classpath:db/migration"