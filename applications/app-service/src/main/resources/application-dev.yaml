server:
  port: 8081
spring:
  application:
    name: "RequestMS"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
routes:
  paths:
    crearSolicitud: "/api/v1/solicitud"
    solicitudesRevision: "/api/v1/solicitud"
springdoc:
  swagger-ui:
    path: "/swagger-docs"
  api-docs:
    path: "/api-docs"
    groups:
      enabled: true
adapters:
  r2dbc:
    host: "localhost"
    port: 3306
    database: "solicitudes"
    schema: "V1__init-config-database-dev.sql"
    username: "root"
    password: "password"
flyway:
  enabled: true
  baseline-on-migrate: true
  locations: "classpath:db/migration"
jwt:
  secret: a-string-secret-at-least-256-bits-long
  expiration: 3600